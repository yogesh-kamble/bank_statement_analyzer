<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Purchase Decision Tool</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <h1>Purchase Decision Tool</h1>

    <div class="form-group">
        <label>Monthly Income</label>
        <input type="number" id="income">
    </div>

    <div class="form-group">
        <label>Monthly Expenses</label>
        <input type="number" id="expenses">
    </div>

    <div class="form-group">
        <label>Current Savings</label>
        <input type="number" id="savings">
    </div>

    <div class="form-group">
        <label>Purchase Amount</label>
        <input type="number" id="purchase">
    </div>

    <div class="form-group">
        <label>EMI Months</label>
        <input type="number" id="months" value="12">
    </div>

    <button id="analyze-btn" onclick="analyzePurchase()">
        Analyze Purchase
    </button>

    <div id="result"></div>

</div>

<script src="widget.js"></script>

</body>
</html>
