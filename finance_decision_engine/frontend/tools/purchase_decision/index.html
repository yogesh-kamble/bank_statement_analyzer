<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Decision Tool</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <h1>Purchase Decision Tool</h1>

    <div class="form-group">
        <label>Monthly Income</label>
        <input
            type="number"
            id="income"
            placeholder="250000"
        >
    </div>

    <div class="form-group">
        <label>Monthly Expenses</label>
        <input
            type="number"
            id="expenses"
            placeholder="180000"
        >
    </div>

    <div class="form-group">
        <label>Current Savings</label>
        <input
            type="number"
            id="savings"
            placeholder="4000000"
        >
    </div>

    <div class="form-group">
        <label>Purchase Amount</label>
        <input
            type="number"
            id="purchase"
            placeholder="1000000"
        >
    </div>

    <div class="form-group">
        <label>Payment Mode</label>

        <select id="paymentMode">

            <option value="cash">
                Pay From Savings
            </option>

            <option value="emi">
                EMI / Loan
            </option>

        </select>
    </div>

    <!-- EMI FIELDS -->

    <div
        id="emiSection"
        style="display:none;"
    >

        <div class="form-group">

            <label>Down Payment</label>

            <input
                type="number"
                id="downPayment"
                value="0"
                placeholder="200000"
            >

        </div>

        <div class="form-group">

            <label>EMI Months</label>

            <input
                type="number"
                id="emiMonths"
                value="12"
                placeholder="12"
            >

        </div>

        <div class="form-group">

            <label>Interest Rate (%)</label>

            <input
                type="number"
                id="interestRate"
                value="12"
                placeholder="12"
            >

        </div>

    </div>

    <button
        id="analyze-btn"
        onclick="analyzePurchase()"
    >
        Analyze Purchase
    </button>

    <div id="result"></div>

</div>

<script src="config.js"></script>
<script src="widget.js"></script>

</body>
</html>
